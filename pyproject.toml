[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-weed-counter"
version = "0.1.0"
description = "Reproducible plant and weed detection/counting baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7",
  "ultralytics==8.4.110",
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
tools = [
  "pillow-heif>=0.18,<1",
  "pycocotools>=2.0,<3",
]

[project.scripts]
plant-build-dataset = "plant_counter.dataset:main"
plant-audit-annotations = "plant_counter.audit:main"
plant-train = "plant_counter.train:main"
plant-evaluate = "plant_counter.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
